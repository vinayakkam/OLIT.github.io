<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging in… — OLIT</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    body { align-items: center; justify-content: center; padding: 16px; }
    .callback-card { width: 100%; max-width: 380px; text-align: center; padding: 48px 36px; border-radius: var(--radius-xl); }
    .callback-card .spinner { margin: 0 auto 20px; }
    .callback-card h1 { font-size: 1.2rem; }
  </style>
</head>
<body>
<!-- Discord OAuth redirect target. This path is registered in the Discord developer portal: do not move it. -->
<main class="card callback-card" aria-live="polite">
  <div id="state-loading">
    <div class="spinner spinner-lg"></div>
    <h1>Logging you in…</h1>
    <p class="text-sm mt-sm">Connecting your Discord account</p>
  </div>
  <div id="state-error" class="hidden">
    <div style="font-size:2rem;margin-bottom:16px" aria-hidden="true">⚠️</div>
    <h1>Login failed</h1>
    <p class="text-sm mt-sm" id="err-msg">Something went wrong.</p>
    <div class="actions mt-lg">
      <a href="/bot/dashboard.html" class="btn btn-primary btn-sm">Try again</a>
      <a href="/bot/" class="btn btn-secondary btn-sm">Bot home</a>
    </div>
  </div>
</main>

<script src="/assets/js/auth.js"></script>
<script>
  Auth.handleCallback()
    .then(() => {
      // Drop the token from the URL and browser history before leaving.
      window.location.replace('/bot/dashboard.html');
    })
    .catch(e => {
      history.replaceState(null, '', window.location.pathname);
      document.getElementById('state-loading').classList.add('hidden');
      document.getElementById('state-error').classList.remove('hidden');
      document.getElementById('err-msg').textContent = e.message;
    });
</script>
</body>
</html>
