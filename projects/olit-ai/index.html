<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIT AI — Nexus Engine</title>
  
  <!-- Browser Favicon - Linked from the root of your GitHub repo -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vinayakkam/OLIT.github.io/main/Logo.png">
  
  <style>
    :root {
      --bg: #09090b;
      --sidebar-bg: #0c0c0f;
      --card-bg: #111114;
      --card-hover: #161619;
      
      /* New Unified Chat Bubble Backgrounds */
      --user-bubble-bg: #2563eb; /* Bright Blue */
      --bot-bubble-bg: #1e1e24; /* Dark Charcoal */
      
      --border: #242427;
      --border-focus: #4a4a4f;
      --text: #f1f1f3;
      --text-muted: #8c8c93;
      
      /* Color Accents */
      --accent-bright: #ffffff;
      --accent-invert: #09090b;
      --accent-bot-header: #22d3ee; /* Bright Cyan */
      
      /* Visible Pulse Effect Palette */
      --color-pulse-glow: rgba(220, 230, 255, 0.45); /* Intense, pale blue glow */
      
      --mono-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.02) 0%, transparent 55%);
    }

    /* Sidebar Styling */
    aside {
      width: 270px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.1rem;
      gap: 1.5rem;
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    /* Logo linked from the root of your repo with visible pulse effect */
    .brand-title img.logo-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      object-fit: contain;
      
      /* FIX: Enhanced Pulse Animation on logo is now clearly visible */
      animation: nexusPulseVisible 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes nexusPulseVisible {
      0%, 100% { 
          box-shadow: 0 0 8px transparent; 
          transform: scale(1);
      }
      50% { 
          box-shadow: 0 0 15px var(--color-pulse-glow); 
          transform: scale(1.03); /* Subtle size increase to make it pop */
      }
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .tag {
      font-family: var(--mono-font);
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .btn-new-chat {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem;
      border-radius: 7px;
      font-family: var(--mono-font);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.15s ease;
    }

    .btn-new-chat:hover {
      background: var(--card-hover);
      border-color: var(--border-focus);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 0.2rem;
    }

    .history-item {
      padding: 0.6rem 0.8rem;
      border-radius: 7px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover, .history-item.active {
      background: var(--card-bg);
      color: var(--text);
    }

    .history-item .delete-btn {
      display: none;
      color: #ee4444;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .history-item:hover .delete-btn { display: inline; }

    /* Main Container */
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      padding: 2.5rem 1.75rem;
    }

    /* --- Chat Container Unified Styles --- */
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem; /* Tighter gap for unified look */
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 0.6rem;
      margin-bottom: 2rem;
    }

    /* Standard Message Structure */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* FIX: User Messages Aligned Right */
    .message.user {
      align-self: flex-end;
      align-items: flex-end; /* Align header right too */
    }

    /* FIX: Bot Messages Aligned Left */
    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    /* FIX: Standard Bot Header with Cyan Accent */
    .message.bot .msg-header {
      font-family: var(--mono-font);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-bot-header); /* Unified Cyan header */
      margin-bottom: 0.25rem;
    }
    
    /* Hide User headers for minimalistic look - bubbles define role */
    .message.user .msg-header { display: none; }

    /* FIX: Unified Bubble Styles (replacing boxes) */
    .msg-body {
      border-radius: 12px;
      padding: 0.9rem 1.25rem;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* User Bubble - Right side Blue */
    .message.user .msg-body {
      background-color: var(--user-bubble-bg);
      color: #ffffff;
      border-bottom-right-radius: 4px; /* Distinct corner */
      text-align: right;
    }

    /* Bot Bubble - Left side Dark Charcoal */
    .message.bot .msg-body {
      background-color: var(--bot-bubble-bg);
      color: #e6edf3;
      border-top-left-radius: 4px; /* Distinct corner */
      border: 1px solid var(--border); /* Subtle definition */
      text-align: left;
    }

    /* Bot Text Formatting Improvements (Bullet points, etc.) */
    .message.bot .msg-body strong {
      color: var(--accent-bot-header); /* Key terms use Cyan accent */
    }

    .message.bot .msg-body ul {
        margin-top: 0.5rem;
        margin-left: 1.25rem;
        list-style-type: disc;
    }
    
    .message.bot .msg-body li {
        margin-bottom: 0.35rem;
    }

    /* Code block formatting inside bot response */
    .msg-body pre {
        background: rgba(0,0,0,0.3);
        padding: 1rem;
        border-radius: 8px;
        margin-top: 0.75rem;
        margin-bottom: 0.75rem;
        overflow-x: auto;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    /* FIX: Professional Code formatting style */
    .msg-body code {
        font-family: var(--mono-font);
        font-size: 0.82rem;
        color: #f8fafc;
        line-height: 1.45;
        background: rgba(255,255,255,0.04);
        padding: 0.1rem 0.3rem;
        border-radius: 4px;
    }
    
    /* Override for pre code blocks */
    .msg-body pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
    }

    /* Input Dock */
    .input-dock {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
    }

    .dropzone-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.9rem;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .dropzone-bar:hover { border-color: var(--border-focus); color: var(--text); }

    textarea {
      width: 100%;
      height: 75px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
    }

    .dock-footer {
      display: flex;
      justify-content: flex-end; /* Send Button right-aligned */
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.9rem;
    }

    button.btn-submit {
      background: var(--accent);
      color: var(--accent-invert);
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: var(--mono-font);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button.btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Init Message formatting */
    .init-message {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 2rem;
      font-family: var(--mono-font);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside>
    <div class="brand-row">
      <div class="brand-title">
        <!-- OLIT Nexus Logo linked from the root of your repo, fixed case to 'Logo.png' -->
        <img src="https://raw.githubusercontent.com/vinayakkam/OLIT.github.io/main/Logo.png" alt="OLIT Nexus Logo" class="logo-icon">
        <h1>OLIT Nexus</h1>
      </div>
      <span class="tag">Core</span>
    </div>

    <button class="btn-new-chat" id="newChatBtn">┼ New Nexus Session</button>

    <div class="history-list" id="historyList"></div>
  </aside>

  <!-- Main Chat Flow -->
  <main>
    <div class="chat-container" id="chatContainer">
      <!-- Init message, no bubble -->
      <div class="init-message">
          Synthesis Engine Ready. Paste data, summarize text, synthesis code, task operation... (Enter to send, Shift+Enter for new line)
      </div>
    </div>

    <!-- Input Control Dock -->
    <div class="input-dock">
      <div class="dropzone-bar" onclick="document.getElementById('fileInput').click()">
        <span id="fileLabel">📎 Attach PDF, Image, or Text file...</span>
        <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
      </div>

      <textarea id="promptInput" placeholder="Analyze data, summarize text, synthesize code... (Enter to send, Shift+Enter for newline)"></textarea>

      <div class="dock-footer">
        <button class="btn-submit" id="sendBtn">Synthesize</button>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'https://olitapi.olittechnologies.co.in';

    // Elements
    const chatContainer = document.getElementById('chatContainer');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyList = document.getElementById('historyList');

    // Chat History Array
    let chats = JSON.parse(localStorage.getItem('olit_nexus_chats') || '[]');
    let currentChatId = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) fileLabel.textContent = `📄 ${e.target.files[0].name}`;
    });

    // Handle Keyboard Flow: Enter = Send, Shift+Enter = New Line in Textarea
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);
    newChatBtn.addEventListener('click', createNewChat);

    function createNewChat() {
      currentChatId = Date.now();
      // Reset container with init message, remove all bubbles
      chatContainer.innerHTML = `
        <div class="init-message">
          Synthesis Engine Ready. Paste data, summarize text, synthesis code, task operation... (Enter to send, Shift+Enter for new line)
        </div>
      `;
      renderHistory();
    }

    async function handleSend() {
      const text = promptInput.value.trim();
      const hasFile = fileInput.files.length > 0;

      if (!text && !hasFile) return;

      if (!currentChatId) currentChatId = Date.now();

      // Clear the init message if it's the first message in the container
      if(chatContainer.querySelector('.init-message')) {
          chatContainer.innerHTML = '';
      }

      // Append User Message bubble
      appendMessageBubble('user', text || `Attached asset: ${fileInput.files[0].name}`);

      sendBtn.disabled = true;
      sendBtn.textContent = 'Synthesizing...';
      promptInput.value = '';

      try {
        if (hasFile) {
          const formData = new FormData();
          formData.append('file', fileInput.files[0]);
          if (text) formData.append('text', text);

          const res = await fetch(`${API_BASE}/api/summarize`, { method: 'POST', body: formData });
          const data = await res.json();

          if (data.success) {
            renderSummaryResponse(data);
          } else {
            appendMessageBubble('bot', `Nexus Synthesis Error: ${data.error}`);
          }
          fileInput.value = '';
          fileLabel.textContent = '📎 Attach PDF, Image, or Text file...';
        } else {
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();

          if (data.success) {
            appendMessageBubble('bot', data.reply, data.sources);
          } else {
            appendMessageBubble('bot', `Nexus Synthesis Error: ${data.error}`);
          }
        }
      } catch (err) {
        appendMessageBubble('bot', 'Could not connect to OLIT Nexus backend.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Synthesize';
        saveChatHistory(text || 'Synthesis Operation');
      }
    }

    // FIX: Standard appendMessage implementation, role specific bubbles, aligned correctly
    function appendMessageBubble(role, content, sources = []) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      let sourcesHtml = '';
      if (sources && sources.length) {
        sourcesHtml = `<ul class="sources-list">` + 
          sources.map(s => `<li><a href="${s.url}" target="_blank">🔗 ${s.title}</a></li>`).join('') + 
          `</ul>`;
      }

      // FIX: User messages align-self: flex-end in CSS, and text-align right in CSS

      msgDiv.innerHTML = `
        <span class="msg-header">${role === 'user' ? '' : 'Nexus Engine'}</span>
        <div class="msg-body">${formatBotResponse(content)}${sourcesHtml}</div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // New helper to format bot responses like bullet points, key terms, etc.
    function formatBotResponse(text) {
        // Simple replacements to mock standard formatting without a full Markdown parser
        
        // Key takeaway arrows: -> to →
        let formatted = text.replace(/->/g, '→');
        
        // Key terms in quotes to bold with cyan accent: 'term' to <strong>term</strong>
        formatted = formatted.replace(/'([^']+)'/g, '<strong>$1</strong>');
        
        // Bullet points (leading dash or asterisk): - text to <ul><li>text</li></ul>
        const lines = formatted.split('\n');
        let insideList = false;
        let finalHtml = '';

        lines.forEach(line => {
            const trimmedLine = line.trim();
            if (trimmedLine.startsWith('- ') || trimmedLine.startsWith('* ')) {
                if (!insideList) {
                    finalHtml += '<ul>';
                    insideList = true;
                }
                finalHtml += `<li>${trimmedLine.substring(2)}</li>`;
            } else {
                if (insideList) {
                    finalHtml += '</ul>';
                    insideList = false;
                }
                finalHtml += line + '\n'; // Preserve original line with potential line break replacements later
            }
        });
        
        if (insideList) {
            finalHtml += '</ul>';
        }
        
        // Code Block detection (mocks full parser, assuming backticks mean monospaced code)
        // Wraps triple backticks in professional pre/code blocks, others in standard code tag.
        finalHtml = finalHtml.replace(/```python\n([\s\S]*?)```/g, '<pre><code class="python">$1</code></pre>'); // Named language block
        finalHtml = finalHtml.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>'); // Triple backtick block
        finalHtml = finalHtml.replace(/`([^`]+)`/g, '<code>$1</code>'); // Single backtick inline code

        return finalHtml.replace(/\n/g, '<br>'); // Simple newline formatting for non-markdown parts
    }

    function renderSummaryResponse(data) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';
      
      const points = data.summary.map(pt => `• ${pt}`).join('\n');
      
      msgDiv.innerHTML = `
        <span class="msg-header">Nexus Engine</span>
        <div class="msg-body">
          <div class="metrics-bar">
            <div class="metric-item"><div class="metric-value">${data.stats.total_words}</div><div class="metric-label">Words</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.reduction}%</div><div class="metric-label">Reduction</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.read_time}m</div><div class="metric-label">Read Time</div></div>
          </div>
          <strong>Nexus Synthesis Key Takeaways:</strong>\n${escapeHtml(points)}
        </div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function saveChatHistory(preview) {
      const existing = chats.find(c => c.id === currentChatId);
      if (existing) {
        existing.preview = preview;
        existing.html = chatContainer.innerHTML;
      } else {
        chats.unshift({ id: currentChatId, preview: preview, html: chatContainer.innerHTML });
      }
      localStorage.setItem('olit_nexus_chats', JSON.stringify(chats));
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = chats.map(c => `
        <div class="history-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat(${c.id})">
          <span>${escapeHtml(c.preview.substring(0, 22))}</span>
          <span class="delete-btn" onclick="deleteChat(event, ${c.id})">✕</span>
        </div>
      `).join('');
    }

    window.loadChat = (id) => {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (chat) {
        chatContainer.innerHTML = chat.html;
        renderHistory();
      }
    };

    window.deleteChat = (e, id) => {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      localStorage.setItem('olit_nexus_chats', JSON.stringify(chats));
      if (currentChatId === id) createNewChat();
      else renderHistory();
    };

    // Init Session
    renderHistory();
  </script>
</body>
</html>
