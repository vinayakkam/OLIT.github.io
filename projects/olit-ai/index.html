<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIT Nexus — AI Console</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #08090b;
      --sidebar-bg: #0b0c0e;
      --panel: #111216;
      --panel-elevated: #16171c;
      --border: #1e1f24;
      --border-soft: #17181c;
      --border-focus: #33353c;

      --text: #f2f3f5;
      --text-dim: #8b8e97;
      --text-faint: #55575f;

      --accent: #3b6cf6;
      --accent-hover: #2f58d6;
      --accent-soft: rgba(59, 108, 246, 0.10);
      --accent-cyan: #22d3ee;
      --online: #10b981;
      --offline: #ef4444;

      --display-font: 'Space Grotesk', ui-sans-serif, sans-serif;
      --body-font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scrollbar-color: var(--border-focus) transparent; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(59, 108, 246, 0.05) 0%, transparent 45%),
        linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: auto, 34px 34px, 34px 34px;
      color: var(--text);
      font-family: var(--body-font);
      height: 100vh;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent-soft); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Sidebar ---------- */
    aside {
      width: 258px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      padding: 1.35rem 1rem;
      gap: 1.1rem;
      flex-shrink: 0;
    }

    .brand-block { padding-bottom: 1rem; border-bottom: 1px solid var(--border-soft); }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.55rem;
    }

    .brand-title img.logo-icon {
      width: 22px; height: 22px;
      border-radius: 5px;
      object-fit: contain;
    }

    .brand-title h1 {
      font-family: var(--display-font);
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Signature: live backend heartbeat */
    .heartbeat {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--mono-font);
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      color: var(--text-faint);
    }

    .heartbeat .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .heartbeat.online .dot {
      background: var(--online);
      box-shadow: 0 0 0 0 rgba(16,185,129,0.5);
      animation: ping 2.2s cubic-bezier(0.4,0,0.6,1) infinite;
    }
    .heartbeat.online { color: var(--text-dim); }
    .heartbeat.offline .dot { background: var(--offline); }
    .heartbeat.offline { color: var(--offline); }

    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
      70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heartbeat.online .dot { animation: none; }
    }

    .btn-new-chat {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.15s ease;
    }
    .btn-new-chat:hover { background: var(--panel); border-color: var(--border-focus); }
    .btn-new-chat svg { width: 16px; height: 16px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      overflow-y: auto;
      flex-grow: 1;
    }

    .history-item {
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item:hover, .history-item.active { background: var(--panel); color: var(--text); }
    .history-item .delete-btn { display: none; color: var(--offline); font-size: 0.78rem; margin-left: 0.5rem; }
    .history-item:hover .delete-btn { display: inline; }

    /* ---------- Main ---------- */
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      padding: 2rem 1.5rem 1.5rem;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 0.4rem;
      margin-bottom: 1.5rem;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-faint);
    }
    .empty-state .eyebrow {
      font-family: var(--mono-font);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 0.6rem;
    }
    .empty-state h2 {
      font-family: var(--display-font);
      font-size: 1.3rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.bot { align-self: flex-start; align-items: flex-start; }

    .message.bot .msg-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--mono-font);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent-cyan);
      margin-bottom: 0.3rem;
    }
    .message.bot .msg-header .latency {
      color: var(--text-faint);
      text-transform: none;
      letter-spacing: 0;
    }
    .message.user .msg-header { display: none; }

    .msg-body {
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .msg-body {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .msg-body {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent-cyan);
      color: #e7e9ec;
      border-top-left-radius: 4px;
    }

    .msg-body ul { margin-top: 0.45rem; margin-left: 1.15rem; list-style-type: disc; }
    .msg-body li { margin-bottom: 0.3rem; }

    .msg-body pre {
      background: rgba(0,0,0,0.35);
      padding: 0.9rem;
      border-radius: 8px;
      margin: 0.65rem 0;
      overflow-x: auto;
      border: 1px solid var(--border-soft);
    }
    .msg-body code {
      font-family: var(--mono-font);
      font-size: 0.8rem;
      background: rgba(255,255,255,0.04);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
    }
    .msg-body pre code { background: transparent; padding: 0; }

    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(0,0,0,0.25);
      margin-bottom: 0.8rem;
      overflow: hidden;
    }
    .metric-item { padding: 0.65rem; text-align: center; border-right: 1px solid var(--border); }
    .metric-item:last-child { border-right: none; }
    .metric-value { font-family: var(--mono-font); font-size: 1.05rem; font-weight: 500; }
    .metric-label { font-family: var(--mono-font); font-size: 0.58rem; color: var(--text-faint); text-transform: uppercase; margin-top: 0.15rem; }

    .sources-list { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.75rem; list-style: none; }
    .sources-list a { color: var(--text-faint); font-family: var(--mono-font); font-size: 0.7rem; text-decoration: none; }
    .sources-list a:hover { color: var(--text-dim); text-decoration: underline; }

    /* ---------- Input dock ---------- */
    .input-dock {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }

    .dock-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .dropzone-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      background: var(--bg);
      border: 1px dashed var(--border-focus);
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.76rem;
      color: var(--text-faint);
      transition: all 0.15s ease;
    }
    .dropzone-bar:hover { border-color: var(--accent); color: var(--text-dim); }

    .msg-header .web-tag {
      color: var(--accent-cyan);
      text-transform: none;
      letter-spacing: 0;
    }

    textarea {
      width: 100%;
      height: 66px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      resize: none;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--text-faint); }

    .dock-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid var(--border-soft);
      padding-top: 0.7rem;
    }

    button.btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1.15rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.79rem;
      cursor: pointer;
      font-family: var(--body-font);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    button.btn-submit:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------- Typing indicator ---------- */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0.3rem 0;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      animation: typingBounce 1.1s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing-dots span { animation: none; opacity: 0.7; }
    }

    /* ---------- Small polish animations ---------- */
    .btn-new-chat, .dropzone-bar, button.btn-submit, .history-item {
      transition: all 0.15s ease, transform 0.1s ease;
    }
    button.btn-submit:active { transform: scale(0.96); }
    .btn-new-chat:active { transform: scale(0.97); }

    /* ---------- Mobile topbar (hidden on desktop) ---------- */
    .mobile-topbar {
      display: none;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border-soft);
      background: var(--sidebar-bg);
      flex-shrink: 0;
    }
    .mobile-topbar .menu-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px; height: 34px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }
    .mobile-topbar .menu-btn:active { background: var(--panel); }
    .mobile-topbar .mobile-brand {
      font-family: var(--display-font);
      font-weight: 600;
      font-size: 0.95rem;
      flex-grow: 1;
    }
    .mobile-topbar .mobile-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
    }
    .mobile-topbar .mobile-dot.online { background: var(--online); }
    .mobile-topbar .mobile-dot.offline { background: var(--offline); }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .sidebar-backdrop.show { display: block; opacity: 1; }

    @media (max-width: 780px) {
      body { flex-direction: column; height: 100dvh; }

      .mobile-topbar { display: flex; }

      aside {
        position: fixed;
        top: 0; left: 0;
        height: 100dvh;
        width: 82vw;
        max-width: 300px;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 8px 0 24px rgba(0,0,0,0.4);
      }
      aside.open { transform: translateX(0); }

      main {
        max-width: 100%;
        height: auto;
        flex: 1;
        min-height: 0;
        padding: 1rem 0.9rem 0.9rem;
      }

      .empty-state h2 { font-size: 1.05rem; }
      .message { max-width: 94%; }
      .msg-body { padding: 0.75rem 0.95rem; font-size: 0.87rem; }
      textarea { height: 56px; font-size: 0.87rem; }
      .input-dock { padding: 0.85rem 0.9rem; }
    }

    @media (max-width: 420px) {
      .metrics-bar { grid-template-columns: repeat(3, 1fr); }
      .metric-value { font-size: 0.92rem; }
    }
  </style>
</head>
<body>

  <div class="mobile-topbar">
    <button class="menu-btn" id="menuToggle" aria-label="Toggle menu">☰</button>
    <span class="mobile-brand">OLIT Nexus</span>
    <span class="mobile-dot" id="mobileDot"></span>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside id="sidebar">
    <div class="brand-block">
      <div class="brand-title">
        <img src="logo.png" alt="OLIT Nexus" class="logo-icon">
        <h1>OLIT Nexus</h1>
      </div>
      <div class="heartbeat" id="heartbeat">
        <span class="dot"></span>
        <span id="heartbeatText">checking backend…</span>
      </div>
    </div>

    <button class="btn-new-chat" id="newChatBtn">
      <svg viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      New chat
    </button>

    <div class="history-list" id="historyList"></div>
  </aside>

  <main>
    <div class="chat-container" id="chatContainer">
      <div class="empty-state" id="emptyState">
        <div class="eyebrow">Self-hosted · Qwen2.5-Coder</div>
        <h2>Ask something, attach a document,<br>or toggle web search.</h2>
      </div>
    </div>

    <div class="input-dock">
      <div class="dock-toprow">
        <div class="dropzone-bar" onclick="document.getElementById('fileInput').click()">
          <span id="fileLabel">📎 Attach PDF, image, or text file…</span>
          <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
        </div>
      </div>

      <textarea id="promptInput" placeholder="Ask a coding question, chat, or drop a file to summarize… (Enter to send, Shift+Enter for newline)"></textarea>

      <div class="dock-footer">
        <button class="btn-submit" id="sendBtn">Send <span>↑</span></button>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'https://assistant-backend-592298774596.us-central1.run.app';

    const chatContainer = document.getElementById('chatContainer');
    const emptyState = document.getElementById('emptyState');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyList = document.getElementById('historyList');
    const heartbeat = document.getElementById('heartbeat');
    const heartbeatText = document.getElementById('heartbeatText');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const menuToggle = document.getElementById('menuToggle');
    const mobileDot = document.getElementById('mobileDot');

    let chats = JSON.parse(localStorage.getItem('olit_nexus_chats') || '[]');
    let currentChatId = null;

    function openDrawer() { sidebar.classList.add('open'); sidebarBackdrop.classList.add('show'); }
    function closeDrawer() { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('show'); }
    menuToggle.addEventListener('click', () => {
      sidebar.classList.contains('open') ? closeDrawer() : openDrawer();
    });
    sidebarBackdrop.addEventListener('click', closeDrawer);

    // ---- Live backend heartbeat ----
    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(5000) });
        if (res.ok) {
          heartbeat.className = 'heartbeat online';
          heartbeatText.textContent = 'backend online';
          mobileDot.className = 'mobile-dot online';
          return;
        }
        throw new Error('bad status');
      } catch {
        heartbeat.className = 'heartbeat offline';
        heartbeatText.textContent = 'backend unreachable';
        mobileDot.className = 'mobile-dot offline';
      }
    }
    checkHealth();
    setInterval(checkHealth, 30000);

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) fileLabel.textContent = `📄 ${e.target.files[0].name}`;
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);
    newChatBtn.addEventListener('click', createNewChat);

    function createNewChat() {
      currentChatId = Date.now();
      chatContainer.innerHTML = '';
      chatContainer.appendChild(emptyState);
      renderHistory();
      closeDrawer();
    }

    // Real, model-generated chat titles — the backend reads the first
    // exchange and writes a short summary-style title, the same way a
    // proper assistant names a conversation, instead of a regex guess.
    async function requestChatTitle(userMsg, botReply) {
      try {
        const res = await fetch(`${API_BASE}/api/title`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userMsg, reply: botReply })
        });
        const data = await res.json();
        return (data.success && data.title) ? data.title : null;
      } catch {
        return null;
      }
    }

    function showTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <span class="msg-header">Nexus Engine</span>
        <div class="msg-body typing-dots"><span></span><span></span><span></span></div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function handleSend() {
      const text = promptInput.value.trim();
      const hasFile = fileInput.files.length > 0;
      if (!text && !hasFile) return;

      if (!currentChatId) currentChatId = Date.now();
      if (emptyState.parentNode === chatContainer) emptyState.remove();

      appendMessageBubble('user', text || `Attached file: ${fileInput.files[0].name}`);
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';
      promptInput.value = '';
      closeDrawer();

      const startedAt = performance.now();
      const isFirstExchange = !chats.find(c => c.id === currentChatId);
      showTypingIndicator();

      try {
        if (hasFile) {
          const formData = new FormData();
          formData.append('file', fileInput.files[0]);
          if (text) formData.append('text', text);

          const res = await fetch(`${API_BASE}/api/summarize`, { method: 'POST', body: formData });
          const data = await res.json();
          removeTypingIndicator();

          if (data.success) {
            renderSummaryBubble(data, performance.now() - startedAt);
          } else {
            appendMessageBubble('bot', `Error: ${data.error}`);
          }
          fileInput.value = '';
          fileLabel.textContent = '📎 Attach PDF, image, or text file…';
          saveChatHistory();
        } else {
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();
          removeTypingIndicator();

          if (data.success) {
            appendMessageBubble('bot', data.reply, data.sources, performance.now() - startedAt);
            saveChatHistory();

            // Only ask for a title on the first exchange of a new chat.
            if (isFirstExchange) {
              requestChatTitle(text, data.reply).then(title => {
                if (!title) return;
                const entry = chats.find(c => c.id === currentChatId);
                if (entry) {
                  entry.title = title;
                  localStorage.setItem('olit_nexus_chats', JSON.stringify(chats));
                  renderHistory();
                }
              });
            }
          } else {
            appendMessageBubble('bot', `Error: ${data.error}`);
            saveChatHistory();
          }
        }
      } catch (err) {
        removeTypingIndicator();
        appendMessageBubble('bot', 'Could not reach the backend. Check the heartbeat status in the sidebar.');
        saveChatHistory();
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = 'Send <span>↑</span>';
      }
    }

    function appendMessageBubble(role, content, sources = [], latencyMs = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      let sourcesHtml = '';
      if (sources && sources.length) {
        sourcesHtml = `<ul class="sources-list">` +
          sources.map(url => `<li><a href="${url}" target="_blank">🔗 ${new URL(url).hostname}</a></li>`).join('') +
          `</ul>`;
      }

      const latencyTag = latencyMs !== null ? `<span class="latency">· ${Math.round(latencyMs)}ms</span>` : '';
      const webTag = sources && sources.length ? `<span class="web-tag">· 🔎 web</span>` : '';

      msgDiv.innerHTML = `
        <span class="msg-header">${role === 'user' ? '' : `Nexus Engine ${latencyTag}${webTag}`}</span>
        <div class="msg-body">${formatBotResponse(content)}${sourcesHtml}</div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function formatBotResponse(text) {
      let formatted = escapeHtml(text);
      formatted = formatted.replace(/```python\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      formatted = formatted.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

      const lines = formatted.split('\n');
      let insideList = false;
      let finalHtml = '';
      lines.forEach(line => {
        const t = line.trim();
        if (t.startsWith('- ') || t.startsWith('* ')) {
          if (!insideList) { finalHtml += '<ul>'; insideList = true; }
          finalHtml += `<li>${t.substring(2)}</li>`;
        } else {
          if (insideList) { finalHtml += '</ul>'; insideList = false; }
          finalHtml += line + '\n';
        }
      });
      if (insideList) finalHtml += '</ul>';
      return finalHtml.replace(/\n/g, '<br>');
    }

    function renderSummaryBubble(data, latencyMs) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';
      const points = data.summary.map(pt => `• ${pt}`).join('\n');
      const latencyTag = `<span class="latency">· ${Math.round(latencyMs)}ms</span>`;

      msgDiv.innerHTML = `
        <span class="msg-header">Nexus Engine ${latencyTag}</span>
        <div class="msg-body">
          <div class="metrics-bar">
            <div class="metric-item"><div class="metric-value">${data.stats.total_words}</div><div class="metric-label">Words</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.reduction}%</div><div class="metric-label">Reduction</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.read_time}m</div><div class="metric-label">Read time</div></div>
          </div>
          ${formatBotResponse(points)}
        </div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#x27;").replace(/"/g, "&quot;");
    }

    function saveChatHistory() {
      const existing = chats.find(c => c.id === currentChatId);
      if (existing) {
        existing.html = chatContainer.innerHTML;
      } else {
        chats.unshift({ id: currentChatId, title: "New chat", html: chatContainer.innerHTML });
      }
      localStorage.setItem('olit_nexus_chats', JSON.stringify(chats));
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = chats.map(c => `
        <div class="history-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat(${c.id})">
          <span>${escapeHtml(c.title || "New chat")}</span>
          <span class="delete-btn" onclick="deleteChat(event, ${c.id})">✕</span>
        </div>
      `).join('');
    }

    window.loadChat = (id) => {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (chat) { chatContainer.innerHTML = chat.html; renderHistory(); }
      closeDrawer();
    };

    window.deleteChat = (e, id) => {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      localStorage.setItem('olit_nexus_chats', JSON.stringify(chats));
      if (currentChatId === id) createNewChat();
      else renderHistory();
    };

    renderHistory();
  </script>
</body>
</html>
