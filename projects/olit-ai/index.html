<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIT AI — Local Engine Hub</title>
  
  <!-- Favicon linked to your GitHub repo logo -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vinayakkam/OLIT-AI/main/logo.png">
  
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --card-hover: #18181b;
      --border: #27272a;
      --border-focus: #52525b;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #ffffff;
      --accent-invert: #09090b;
      --accent-glow: rgba(255, 255, 255, 0.08);
      --mono-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
    }

    header {
      width: 100%;
      max-width: 680px;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: contain;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .tag {
      font-family: var(--mono-font);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 680px;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--mono-font);
      font-size: 0.75rem;
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.03); }
    .tab-btn.active { color: var(--accent); background: var(--card-bg); border: 1px solid var(--border); }

    main {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .view-panel { display: flex; flex-direction: column; gap: 1.25rem; }

    .dropzone {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      background: var(--card-bg);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--border-focus);
      background: var(--card-hover);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .dropzone p { font-size: 0.9rem; color: var(--text); font-weight: 500; }
    .dropzone span {
      font-family: var(--mono-font);
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
      margin-top: 0.5rem;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 1rem;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea { height: 130px; resize: vertical; }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 1px var(--border-focus);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .checkbox-label {
      font-family: var(--mono-font);
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    button.btn-submit {
      background: var(--accent);
      color: var(--accent-invert);
      border: none;
      padding: 0.9rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--mono-font);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    button.btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .output-section {
      border-top: 1px solid var(--border);
      padding-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      overflow: hidden;
    }

    .metric-item {
      padding: 1.1rem 0.8rem;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .metric-item:last-child { border-right: none; }

    .metric-value {
      font-family: var(--mono-font);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .metric-label {
      font-family: var(--mono-font);
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.35rem;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .output-title {
      font-family: var(--mono-font);
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .btn-copy {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-family: var(--mono-font);
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      color: var(--text);
      border-color: var(--border-focus);
      background: rgba(255, 255, 255, 0.03);
    }

    ul.summary-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    ul.summary-list li {
      font-size: 0.92rem;
      line-height: 1.65;
      color: #d4d4d8;
      padding-left: 1.5rem;
      position: relative;
    }

    ul.summary-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.65em;
      width: 5px;
      height: 5px;
      background-color: var(--text-muted);
      border-radius: 50%;
    }

    .chat-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #d4d4d8;
    }

    .sources-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    .sources-list a {
      color: var(--text-muted);
      font-family: var(--mono-font);
      font-size: 0.75rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .sources-list a:hover { color: var(--text); text-decoration: underline; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand-row">
      <div class="brand-title">
        <img src="https://raw.githubusercontent.com/vinayakkam/OLIT-AI/main/logo.png" alt="OLIT Logo">
        <h1>OLIT AI</h1>
      </div>
      <span class="tag">Localhost Engine</span>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('summarize')">Summarize</button>
    <button class="tab-btn" onclick="switchTab('chat')">Chat & Code</button>
  </div>

  <main>
    <!-- Summarizer View -->
    <div id="summarizeView" class="view-panel">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <p id="file-label">Click or drop document/image here</p>
        <span>Supports PDF, TXT, PNG, JPG, WEBP</span>
        <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
      </div>

      <textarea id="textInput" placeholder="Or paste document text here..."></textarea>

      <button class="btn-submit" id="submitBtn">Summarize</button>

      <div class="output-section hidden" id="resultCard">
        <div class="metrics-bar">
          <div class="metric-item">
            <div class="metric-value" id="statWords">0</div>
            <div class="metric-label">Words</div>
          </div>
          <div class="metric-item">
            <div class="metric-value" id="statRed">0%</div>
            <div class="metric-label">Reduced</div>
          </div>
          <div class="metric-item">
            <div class="metric-value" id="statTime">0m</div>
            <div class="metric-label">Read Time</div>
          </div>
        </div>

        <div class="output-header">
          <span class="output-title">Key Takeaways</span>
          <button class="btn-copy" id="copyBtn">Copy</button>
        </div>

        <ul class="summary-list" id="pointsList"></ul>
      </div>
    </div>

    <!-- Chat & Search View -->
    <div id="chatView" class="view-panel hidden">
      <input type="text" id="chatInput" placeholder="Ask a question, generate code, or search the web...">
      
      <div class="controls-row">
        <label class="checkbox-label">
          <input type="checkbox" id="enableSearch"> Enable Web Search
        </label>
        <button class="btn-submit" id="chatBtn">Send</button>
      </div>

      <div class="output-section hidden" id="chatResultCard">
        <div class="output-header">
          <span class="output-title">Response</span>
          <button class="btn-copy" id="copyChatBtn">Copy</button>
        </div>
        <div class="chat-box" id="chatReply"></div>

        <div id="sourcesContainer" class="hidden">
          <span class="output-title" style="display:block; margin-bottom: 0.5rem;">Web Sources</span>
          <ul class="sources-list" id="sourcesList"></ul>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'https://olitapi.olittechnologies.co.in';

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('summarizeView').classList.add('hidden');
      document.getElementById('chatView').classList.add('hidden');

      if (tab === 'summarize') {
        event.target.classList.add('active');
        document.getElementById('summarizeView').classList.remove('hidden');
      } else {
        event.target.classList.add('active');
        document.getElementById('chatView').classList.remove('hidden');
      }
    }

    // Summarizer Logic
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('file-label');
    const textInput = document.getElementById('textInput');
    const submitBtn = document.getElementById('submitBtn');
    const resultCard = document.getElementById('resultCard');
    const pointsList = document.getElementById('pointsList');
    const copyBtn = document.getElementById('copyBtn');

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) fileLabel.textContent = e.target.files[0].name;
    });

    submitBtn.addEventListener('click', async () => {
      const formData = new FormData();
      if (fileInput.files.length) {
        formData.append('file', fileInput.files[0]);
      } else {
        formData.append('text', textInput.value);
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';

      try {
        const response = await fetch(`${API_BASE}/api/summarize`, {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (data.success) {
          document.getElementById('statWords').textContent = data.stats.total_words;
          document.getElementById('statRed').textContent = `${data.stats.reduction}%`;
          document.getElementById('statTime').textContent = `${data.stats.read_time}m`;

          pointsList.innerHTML = data.summary.map(p => `<li>${p}</li>`).join('');
          resultCard.classList.remove('hidden');
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Could not reach backend.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Summarize';
      }
    });

    copyBtn.addEventListener('click', () => {
      const text = Array.from(pointsList.querySelectorAll('li')).map(li => "• " + li.innerText).join('\n');
      navigator.clipboard.writeText(text);
      copyBtn.textContent = 'Copied';
      setTimeout(() => copyBtn.textContent = 'Copy', 2000);
    });

    // Chat / Code / Search Logic
    const chatInput = document.getElementById('chatInput');
    const chatBtn = document.getElementById('chatBtn');
    const enableSearch = document.getElementById('enableSearch');
    const chatResultCard = document.getElementById('chatResultCard');
    const chatReply = document.getElementById('chatReply');
    const copyChatBtn = document.getElementById('copyChatBtn');
    const sourcesContainer = document.getElementById('sourcesContainer');
    const sourcesList = document.getElementById('sourcesList');

    chatBtn.addEventListener('click', async () => {
      const message = chatInput.value.trim();
      if (!message) return;

      chatBtn.disabled = true;
      chatBtn.textContent = 'Generating...';

      try {
        const response = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            enable_search: enableSearch.checked
          })
        });
        const data = await response.json();

        if (data.success) {
          chatReply.textContent = data.reply;
          
          if (data.sources && data.sources.length) {
            sourcesList.innerHTML = data.sources.map(s => `<li><a href="${s.url}" target="_blank">🔗 ${s.title}</a></li>`).join('');
            sourcesContainer.classList.remove('hidden');
          } else {
            sourcesContainer.classList.add('hidden');
          }

          chatResultCard.classList.remove('hidden');
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Could not reach backend API.');
      } finally {
        chatBtn.disabled = false;
        chatBtn.textContent = 'Send';
      }
    });

    copyChatBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(chatReply.textContent);
      copyChatBtn.textContent = 'Copied';
      setTimeout(() => copyChatBtn.textContent = 'Copy', 2000);
    });
  </script>
</body>
</html>
