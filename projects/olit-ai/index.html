<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIT AI — Nexus Engine</title>
  
  <!-- Browser Favicon -->
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    :root {
      --bg: #09090b;
      --sidebar-bg: #0c0c0f;
      --card-bg: #111114;
      --card-hover: #161619;
      
      /* Unified Chat Bubble Backgrounds */
      --user-bubble-bg: #2563eb; /* User: Bright Blue */
      --bot-bubble-bg: #1f1f23;  /* Bot: Dark Charcoal */
      
      --border: #242427;
      --border-focus: #4a4a4f;
      --text: #f1f1f3;
      --text-muted: #8c8c93;
      
      /* Accents */
      --accent-bright: #2563eb; 
      --accent-invert: #ffffff;
      --accent-bot-header: #22d3ee; 
      
      --color-pulse-glow: rgba(220, 230, 255, 0.45); 
      --color-tag-nexus-green: #10b981; 
      --color-summary-words: #e2e8f0;

      --mono-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.02) 0%, transparent 55%);
    }

    /* Sidebar Styling */
    aside {
      width: 270px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.1rem;
      gap: 1.2rem;
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .brand-title img.logo-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      object-fit: contain;
      animation: nexusPulseVisible 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes nexusPulseVisible {
      0%, 100% { 
          box-shadow: 0 0 8px transparent; 
          transform: scale(1);
      }
      50% { 
          box-shadow: 0 0 15px var(--color-pulse-glow); 
          transform: scale(1.03);
      }
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .tag {
      font-family: var(--mono-font);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .tag.nexus-tag {
        color: var(--color-tag-nexus-green);
        border-color: var(--color-tag-nexus-green);
    }

    /* Minimalist "New chat" button */
    .btn-new-chat {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.4rem;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      transition: all 0.15s ease;
    }

    .btn-new-chat:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-new-chat svg {
      width: 18px;
      height: 18px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 0.2rem;
    }

    .history-item {
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover, .history-item.active {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .history-item .delete-btn {
      display: none;
      color: #ee4444;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .history-item:hover .delete-btn { display: inline; }

    /* Main Container */
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      padding: 2.5rem 1.75rem;
    }

    /* Chat Container */
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 0.6rem;
      margin-bottom: 2rem;
    }

    /* Message Bubbles */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message.bot .msg-header {
      font-family: var(--mono-font);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-bot-header);
      margin-bottom: 0.25rem;
    }
    
    .message.user .msg-header { display: none; }

    .msg-body {
      border-radius: 12px;
      padding: 0.9rem 1.25rem;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .msg-body {
      background-color: var(--user-bubble-bg);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      text-align: right;
    }

    .message.bot .msg-body {
      background-color: var(--bot-bubble-bg);
      color: #e6edf3;
      border-top-left-radius: 4px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .message.bot .msg-body strong {
      color: var(--accent-bot-header);
    }

    .message.bot .msg-body ul {
      margin-top: 0.5rem;
      margin-left: 1.25rem;
      list-style-type: disc;
    }
    
    .message.bot .msg-body li {
      margin-bottom: 0.35rem;
    }

    .msg-body pre {
      background: rgba(0,0,0,0.3);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .msg-body code {
      font-family: var(--mono-font);
      font-size: 0.82rem;
      color: #f8fafc;
      line-height: 1.45;
      background: rgba(255,255,255,0.04);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
    }
    
    .msg-body pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
    }

    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(0,0,0,0.2);
      margin-top: 0.75rem;
      margin-bottom: 0.9rem;
      overflow: hidden;
    }

    .metric-item {
      padding: 0.7rem;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .metric-item:last-child { border-right: none; }
    .metric-value { font-family: var(--mono-font); font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .metric-label { font-family: var(--mono-font); font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; margin-top: 0.2rem; }

    .sources-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.9rem;
      list-style: none;
    }

    .sources-list a {
      color: var(--text-muted);
      font-family: var(--mono-font);
      font-size: 0.72rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .sources-list a:hover { color: var(--text); text-decoration: underline; }

    /* Input Dock */
    .input-dock {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
    }

    .dropzone-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.9rem;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .dropzone-bar:hover { border-color: var(--border-focus); color: var(--text); }

    textarea {
      width: 100%;
      height: 75px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
    }

    .dock-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.9rem;
    }

    /* Blue Send Button */
    button.btn-submit {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button.btn-submit:hover { 
      background: #1d4ed8; 
      transform: translateY(-1px); 
    }
    
    button:disabled { 
      opacity: 0.4; 
      cursor: not-allowed; 
      transform: none; 
    }

    canvas.nexus-img {
      border-radius: 7px;
      border: 1px solid var(--border);
      margin-top: 0.6rem;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside>
    <div class="brand-row">
      <div class="brand-title">
        <img src="logo.png" alt="OLIT Nexus Logo" class="logo-icon">
        <h1>OLIT Nexus</h1>
      </div>
      <span class="tag nexus-tag">Nexus</span>
    </div>

    <!-- New chat button -->
    <button class="btn-new-chat" id="newChatBtn">
      <svg viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      New chat
    </button>

    <div class="history-list" id="historyList"></div>
  </aside>

  <!-- Main Chat Flow -->
  <main>
    <div class="chat-container" id="chatContainer"></div>

    <!-- Input Control Dock -->
    <div class="input-dock">
      <div class="dropzone-bar" onclick="document.getElementById('fileInput').click()">
        <span id="fileLabel">📎 Attach PDF, Image, or Text file...</span>
        <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
      </div>

      <textarea id="promptInput" placeholder="Analyze data, summarize text, synthesize code... (Enter to send, Shift+Enter for newline)"></textarea>

      <div class="dock-footer">
        <button class="btn-submit" id="sendBtn">
          Send <span>↑</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'https://olitapi.olittechnologies.co.in';

    // Elements
    const chatContainer = document.getElementById('chatContainer');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyList = document.getElementById('historyList');

    // Chat History Array
    let chats = JSON.parse(localStorage.getItem('olit_nexus_chats') || '[]');
    let currentChatId = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) fileLabel.textContent = `📄 ${e.target.files[0].name}`;
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);
    newChatBtn.addEventListener('click', createNewChat);

    function createNewChat() {
      currentChatId = Date.now();
      chatContainer.innerHTML = '';
      renderHistory();
    }

    // Dynamic Title Generation: Filters out simple greetings and waits for actual context
    function extractDynamicTitle(promptText) {
      if (!promptText) return null;

      let cleanText = promptText.trim().replace(/^hey\s+|^hello\s+|^hi\s+|^please\s+|^can\s+you\s+/i, '');
      
      // If prompt was just "Hi", "Hello", "Hey" or under 3 chars, return null (waiting for next prompt)
      if (cleanText.length < 3 || /^(hi|hello|hey|greetings|help|sup)$/i.test(promptText.trim())) {
        return null;
      }

      // Code generation intent
      if (/python|code|script|function|print|factorial|html|js|css/i.test(cleanText)) {
        let match = cleanText.match(/print\s*\(?["']?([^"'\)]+)["']?\)?/i) || cleanText.match(/(python|code|script|function|factorial|html|js)/i);
        if (match && match[1]) return `Python: ${match[1].substring(0, 15)}`;
        return "Code Generation";
      }

      // Search / Entity intent
      if (/search|find|lookup|about|who is|what is/i.test(cleanText)) {
        let clean = cleanText.replace(/search\s+about\s+|search\s+|find\s+|lookup\s+/i, '');
        return clean.substring(0, 22).replace(/^\w/, c => c.toUpperCase());
      }

      // Image intent
      if (/image|draw|generate image|visual/i.test(cleanText)) {
        return "Image Generation";
      }

      // Default meaningful title
      return cleanText.substring(0, 22).replace(/^\w/, c => c.toUpperCase());
    }

    async function handleSend() {
      const text = promptInput.value.trim();
      const hasFile = fileInput.files.length > 0;

      if (!text && !hasFile) return;

      if (!currentChatId) currentChatId = Date.now();

      appendMessageBubble('user', text || `Attached asset: ${fileInput.files[0].name}`);

      sendBtn.disabled = true;
      sendBtn.innerHTML = 'Sending...';
      promptInput.value = '';

      try {
        if (hasFile) {
          const formData = new FormData();
          formData.append('file', fileInput.files[0]);
          if (text) formData.append('text', text);

          const res = await fetch(`${API_BASE}/api/summarize`, { method: 'POST', body: formData });
          const data = await res.json();

          if (data.success) {
            renderSummaryBubbleResponse(data);
          } else {
            appendMessageBubble('bot', `Nexus Synthesis Error: ${data.error}`);
          }
          fileInput.value = '';
          fileLabel.textContent = '📎 Attach PDF, Image, or Text file...';
        } else {
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();

          if (data.success) {
            if (data.type === 'image') {
              renderNexusImageBubbleResponse(data.prompt || text);
            } else {
              appendMessageBubble('bot', data.reply, data.sources);
            }
          } else {
            appendMessageBubble('bot', `Nexus Synthesis Error: ${data.error}`);
          }
        }
      } catch (err) {
        appendMessageBubble('bot', 'Could not connect to OLIT Nexus backend.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = 'Send <span>↑</span>';
        
        saveChatHistory(text);
      }
    }

    function appendMessageBubble(role, content, sources = []) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      let sourcesHtml = '';
      if (sources && sources.length) {
        sourcesHtml = `<ul class="sources-list">` + 
          sources.map(s => `<li><a href="${s.url}" target="_blank">🔗 ${s.title}</a></li>`).join('') + 
          `</ul>`;
      }

      msgDiv.innerHTML = `
        <span class="msg-header">${role === 'user' ? '' : 'Nexus Engine'}</span>
        <div class="msg-body">${formatBotResponse(content)}${sourcesHtml}</div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function formatBotResponse(text) {
        let formatted = escapeHtml(text);

        formatted = formatted.replace(/-&gt;/g, '→');
        
        formatted = formatted.replace(/```python\n([\s\S]*?)```/g, '<pre><code class="python">$1</code></pre>');
        formatted = formatted.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

        const lines = formatted.split('\n');
        let insideList = false;
        let finalHtml = '';

        lines.forEach(line => {
            const trimmedLine = line.trim();
            if (trimmedLine.startsWith('- ') || trimmedLine.startsWith('* ')) {
                if (!insideList) {
                    finalHtml += '<ul>';
                    insideList = true;
                }
                finalHtml += `<li>${trimmedLine.substring(2)}</li>`;
            } else {
                if (insideList) {
                    finalHtml += '</ul>';
                    insideList = false;
                }
                finalHtml += line + '\n';
            }
        });
        
        if (insideList) {
            finalHtml += '</ul>';
        }
        
        finalHtml = finalHtml.replace(/&amp;#x27;([^&amp;]+)&amp;#x27;/g, '<strong>$1</strong>');

        return finalHtml.replace(/\n/g, '<br>');
    }

    function renderSummaryBubbleResponse(data) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';
      const points = data.summary.map(pt => `• ${pt}`).join('\n');
      
      msgDiv.innerHTML = `
        <span class="msg-header">Nexus Engine</span>
        <div class="msg-body">
          <div class="metrics-bar">
            <div class="metric-item"><div class="metric-value">${data.stats.total_words}</div><div class="metric-label">Words</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.reduction}%</div><div class="metric-label">Reduction</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.read_time_reduction}m</div><div class="metric-label">Read Time</div></div>
          </div>
          <strong>Nexus Synthesis Key Takeaways:</strong>\n${formatBotResponse(points)}
        </div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderNexusImageBubbleResponse(prompt) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';
      
      msgDiv.innerHTML = `
        <span class="msg-header">Nexus Engine</span>
        <div class="msg-body">
          Generated Nexus visual artwork for: <em>"${escapeHtml(prompt)}"</em>
          <br>
          <canvas class="nexus-img" width="400" height="220"></canvas>
        </div>
      `;
      chatContainer.appendChild(msgDiv);

      const canvas = msgDiv.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 400, 220);
      grad.addColorStop(0, '#0c0c0f');
      grad.addColorStop(1, '#161619');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 400, 220);

      ctx.strokeStyle = 'rgba(220, 230, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 15; i++) {
          ctx.beginPath();
          ctx.moveTo(Math.random() * 400, Math.random() * 220);
          ctx.lineTo(Math.random() * 400, Math.random() * 220);
          ctx.stroke();
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '12px monospace';
      ctx.fillText(`[NEXUS RENDER]: ${prompt.substring(0, 35)}...`, 20, 115);

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#x27;").replace(/"/g, "&quot;");
    }

    function saveChatHistory(promptText) {
      const existing = chats.find(c => c.id === currentChatId);
      const generatedTitle = extractDynamicTitle(promptText);

      if (existing) {
        existing.html = chatContainer.innerHTML;
        // If the current title is default ("New chat") or unassigned, try updating with the new prompt
        if ((!existing.title || existing.title === "New chat") && generatedTitle) {
          existing.title = generatedTitle;
        }
      } else {
        chats.unshift({
          id: currentChatId,
          title: generatedTitle || "New chat",
          html: chatContainer.innerHTML
        });
      }
      localStorage.setItem('olit_nexus_chats', JSON.stringify(chats));
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = chats.map(c => `
        <div class="history-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat(${c.id})">
          <span>${escapeHtml(c.title || "New chat")}</span>
          <span class="delete-btn" onclick="deleteChat(event, ${c.id})">✕</span>
        </div>
      `).join('');
    }

    window.loadChat = (id) => {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (chat) {
        chatContainer.innerHTML = chat.html;
        renderHistory();
      }
    };

    window.deleteChat = (e, id) => {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      localStorage.setItem('olit_nexus_chats', JSON.stringify(chats));
      if (currentChatId === id) createNewChat();
      else renderHistory();
    };

    // Init Session
    renderHistory();
  </script>
</body>
</html>
