<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIT Nexus — AI Console</title>
  <link rel="icon" type="image/png" href="logo1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #08090b;
      --sidebar-bg: #0b0c0e;
      --panel: #111216;
      --panel-elevated: #16171c;
      --border: #1e1f24;
      --border-soft: #17181c;
      --border-focus: #33353c;

      --text: #f2f3f5;
      --text-dim: #8b8e97;
      --text-faint: #55575f;

      --accent: #3b6cf6;
      --accent-hover: #2f58d6;
      --accent-soft: rgba(59, 108, 246, 0.10);
      --accent-cyan: #22d3ee;
      --online: #10b981;
      --offline: #ef4444;

      --display-font: 'Space Grotesk', ui-sans-serif, sans-serif;
      --body-font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scrollbar-color: var(--border-focus) transparent; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(59, 108, 246, 0.05) 0%, transparent 45%),
        linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: auto, 34px 34px, 34px 34px;
      color: var(--text);
      font-family: var(--body-font);
      height: 100vh;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent-soft); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    aside {
      width: 258px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      padding: 1.35rem 1rem;
      gap: 1.1rem;
      flex-shrink: 0;
    }

    .brand-block { padding-bottom: 1rem; border-bottom: 1px solid var(--border-soft); }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.55rem;
    }

    .brand-title img.logo-icon {
      width: 22px; height: 22px;
      border-radius: 5px;
      object-fit: contain;
    }

    .brand-title h1 {
      font-family: var(--display-font);
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .heartbeat {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--mono-font);
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      color: var(--text-faint);
    }

    .heartbeat .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .heartbeat.online .dot {
      background: var(--online);
      box-shadow: 0 0 0 0 rgba(16,185,129,0.5);
      animation: ping 2.2s cubic-bezier(0.4,0,0.6,1) infinite;
    }
    .heartbeat.online { color: var(--text-dim); }
    .heartbeat.offline .dot { background: var(--offline); }
    .heartbeat.offline { color: var(--offline); }

    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
      70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heartbeat.online .dot { animation: none; }
    }

    .btn-new-chat {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.15s ease;
    }
    .btn-new-chat:hover { background: var(--panel); border-color: var(--border-focus); }
    .btn-new-chat svg { width: 16px; height: 16px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      overflow-y: auto;
      flex-grow: 1;
    }

    /* ---------- Profile footer ---------- */
    .profile-footer {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem;
      border-top: 1px solid var(--border-soft);
      border-radius: 8px;
    }
    .profile-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display-font);
      font-size: 0.8rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    .profile-meta { flex: 1; min-width: 0; }
    .profile-name {
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-email {
      font-family: var(--mono-font);
      font-size: 0.66rem;
      color: var(--text-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-settings-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 28px; height: 28px;
      border-radius: 7px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .profile-settings-btn:hover { background: var(--panel); color: var(--text); }

    /* ---------- Settings modal ---------- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 60;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-backdrop.show { display: flex; }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 1.75rem;
      max-width: 360px;
      width: 100%;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .modal-header h3 { font-family: var(--display-font); font-size: 1.05rem; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0.2rem;
    }
    .modal-close:hover { color: var(--text); }

    .modal-card .field { margin-bottom: 1rem; }
    .modal-card label {
      display: block;
      font-family: var(--mono-font);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      margin-bottom: 0.35rem;
    }
    .modal-card input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--body-font);
      outline: none;
      transition: border-color 0.15s ease;
    }
    .modal-card input:focus { border-color: var(--accent); }
    .modal-card input:disabled { color: var(--text-faint); cursor: not-allowed; }

    .error-msg, .success-msg {
      font-size: 0.76rem;
      padding: 0.55rem 0.75rem;
      border-radius: 7px;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--offline);
    }
    .success-msg {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--online);
    }
    .error-msg.show, .success-msg.show { display: block; }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.83rem;
      cursor: pointer;
      font-family: var(--body-font);
      margin-bottom: 0.6rem;
      transition: background 0.15s ease;
    }
    .submit-btn:hover { background: var(--accent-hover); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .logout-btn {
      width: 100%;
      background: transparent;
      color: var(--offline);
      border: 1px solid var(--border);
      padding: 0.6rem;
      border-radius: 8px;
      font-size: 0.83rem;
      cursor: pointer;
      font-family: var(--body-font);
      transition: background 0.15s ease;
    }
    .logout-btn:hover { background: rgba(239, 68, 68, 0.08); }

    .history-item {
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item:hover, .history-item.active { background: var(--panel); color: var(--text); }
    .history-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-actions { display: none; align-items: center; gap: 0.4rem; flex-shrink: 0; margin-left: 0.4rem; }
    .history-item:hover .history-actions { display: flex; }
    .rename-btn, .delete-btn { font-size: 0.76rem; cursor: pointer; }
    .rename-btn { color: var(--text-faint); }
    .rename-btn:hover { color: var(--text); }
    .delete-btn { color: var(--offline); }
    .rename-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 5px;
      color: var(--text);
      font-size: 0.82rem;
      font-family: inherit;
      padding: 0.15rem 0.4rem;
      outline: none;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      padding: 2rem 1.5rem 1.5rem;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 0.4rem;
      margin-bottom: 1.5rem;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-faint);
    }
    .empty-state .eyebrow {
      font-family: var(--mono-font);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 0.6rem;
    }
    .empty-state h2 {
      font-family: var(--display-font);
      font-size: 1.3rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.bot { align-self: flex-start; align-items: flex-start; }

    .message.bot .msg-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--mono-font);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent-cyan);
      margin-bottom: 0.3rem;
    }
    .message.bot .msg-header .latency {
      color: var(--text-faint);
      text-transform: none;
      letter-spacing: 0;
    }
    .message.user .msg-header { display: none; }

    .msg-body {
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .msg-body {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .msg-body {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent-cyan);
      color: #e7e9ec;
      border-top-left-radius: 4px;
    }

    .msg-body ul { margin-top: 0.45rem; margin-left: 1.15rem; list-style-type: disc; }
    .msg-body li { margin-bottom: 0.3rem; }

    .code-block-wrapper {
      position: relative;
      margin: 0.65rem 0;
    }
    .code-block-wrapper pre { margin: 0; }
    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-family: var(--mono-font);
      font-size: 0.66rem;
      padding: 0.28rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .code-block-wrapper:hover .copy-code-btn { opacity: 1; }
    .copy-code-btn:hover { background: var(--border); color: var(--text); }
    .copy-code-btn.copied { color: var(--online); border-color: var(--online); }
    /* No hover on touch devices, so keep it visible there */
    @media (hover: none) {
      .copy-code-btn { opacity: 1; }
    }

    .msg-body pre {
      background: rgba(0,0,0,0.35);
      padding: 0.9rem;
      border-radius: 8px;
      margin: 0.65rem 0;
      overflow-x: auto;
      border: 1px solid var(--border-soft);
    }
    .msg-body code {
      font-family: var(--mono-font);
      font-size: 0.8rem;
      background: rgba(255,255,255,0.04);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
    }
    .msg-body pre code { background: transparent; padding: 0; }

    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(0,0,0,0.25);
      margin-bottom: 0.8rem;
      overflow: hidden;
    }
    .metric-item { padding: 0.65rem; text-align: center; border-right: 1px solid var(--border); }
    .metric-item:last-child { border-right: none; }
    .metric-value { font-family: var(--mono-font); font-size: 1.05rem; font-weight: 500; }
    .metric-label { font-family: var(--mono-font); font-size: 0.58rem; color: var(--text-faint); text-transform: uppercase; margin-top: 0.15rem; }

    .sources-list { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.75rem; list-style: none; }
    .sources-list a { color: var(--text-faint); font-family: var(--mono-font); font-size: 0.7rem; text-decoration: none; }
    .sources-list a:hover { color: var(--text-dim); text-decoration: underline; }

    .input-dock {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }

    .dock-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .dropzone-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      background: var(--bg);
      border: 1px dashed var(--border-focus);
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.76rem;
      color: var(--text-faint);
      transition: all 0.15s ease;
    }
    .dropzone-bar:hover { border-color: var(--accent); color: var(--text-dim); }

    .msg-header .web-tag {
      color: var(--accent-cyan);
      text-transform: none;
      letter-spacing: 0;
    }

    textarea {
      width: 100%;
      height: 66px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      resize: none;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--text-faint); }

    .dock-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid var(--border-soft);
      padding-top: 0.7rem;
    }

    button.btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1.15rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.79rem;
      cursor: pointer;
      font-family: var(--body-font);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    button.btn-submit:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0.3rem 0;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      animation: typingBounce 1.1s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing-dots span { animation: none; opacity: 0.7; }
    }

    .btn-new-chat, .dropzone-bar, button.btn-submit, .history-item {
      transition: all 0.15s ease, transform 0.1s ease;
    }
    button.btn-submit:active { transform: scale(0.96); }
    .btn-new-chat:active { transform: scale(0.97); }

    .mobile-topbar {
      display: none;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border-soft);
      background: var(--sidebar-bg);
      flex-shrink: 0;
    }
    .mobile-topbar .menu-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px; height: 34px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }
    .mobile-topbar .menu-btn:active { background: var(--panel); }
    .mobile-topbar .mobile-brand {
      font-family: var(--display-font);
      font-weight: 600;
      font-size: 0.95rem;
      flex-grow: 1;
    }
    .mobile-topbar .mobile-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
    }
    .mobile-topbar .mobile-dot.online { background: var(--online); }
    .mobile-topbar .mobile-dot.offline { background: var(--offline); }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .sidebar-backdrop.show { display: block; opacity: 1; }

    @media (max-width: 780px) {
      body { flex-direction: column; height: 100dvh; }

      .mobile-topbar { display: flex; }

      aside {
        position: fixed;
        top: 0; left: 0;
        height: 100dvh;
        width: 82vw;
        max-width: 300px;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 8px 0 24px rgba(0,0,0,0.4);
      }
      aside.open { transform: translateX(0); }

      main {
        max-width: 100%;
        height: auto;
        flex: 1;
        min-height: 0;
        padding: 1rem 0.9rem 0.9rem;
      }

      .empty-state h2 { font-size: 1.05rem; }
      .message { max-width: 94%; }
      .msg-body { padding: 0.75rem 0.95rem; font-size: 0.87rem; }
      textarea { height: 56px; font-size: 0.87rem; }
      .input-dock { padding: 0.85rem 0.9rem; }
    }

    @media (max-width: 420px) {
      .metrics-bar { grid-template-columns: repeat(3, 1fr); }
      .metric-value { font-size: 0.92rem; }
    }
  </style>
</head>
<body>

  <div class="mobile-topbar">
    <button class="menu-btn" id="menuToggle" aria-label="Toggle menu">☰</button>
    <span class="mobile-brand">OLIT Nexus</span>
    <span class="mobile-dot" id="mobileDot"></span>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside id="sidebar">
    <div class="brand-block">
      <div class="brand-title">
        <img src="logo1.png" alt="OLIT Nexus" class="logo-icon">
        <h1>OLIT Nexus</h1>
      </div>
      <div class="heartbeat" id="heartbeat">
        <span class="dot"></span>
        <span id="heartbeatText">checking backend…</span>
      </div>
    </div>

    <button class="btn-new-chat" id="newChatBtn">
      <svg viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      New chat
    </button>

    <button class="btn-new-chat" id="inviteTriggerBtn">
      <svg viewBox="0 0 24 24">
        <path d="M22 6l-10 7L2 6"></path>
        <path d="M2 6h20v12H2z"></path>
      </svg>
      Invite someone
    </button>

    <div class="history-list" id="historyList"></div>

    <div class="profile-footer" id="profileFooter">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-meta">
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-email" id="profileEmail">—</div>
      </div>
      <button class="profile-settings-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </div>
  </aside>

  <div class="modal-backdrop" id="settingsBackdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Profile settings</h3>
        <button class="modal-close" id="closeSettingsBtn" aria-label="Close">✕</button>
      </div>

      <div class="error-msg" id="settingsError"></div>
      <div class="success-msg" id="settingsSuccess"></div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="settingsEmail" disabled>
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="settingsName" placeholder="Your name">
      </div>
      <div class="field">
        <label>New password (optional)</label>
        <input type="password" id="settingsPassword" placeholder="Leave blank to keep current password" autocomplete="new-password">
      </div>

      <button class="submit-btn" id="saveSettingsBtn">Save changes</button>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="modal-backdrop" id="inviteBackdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Invite someone</h3>
        <button class="modal-close" id="closeInviteBtn" aria-label="Close">✕</button>
      </div>

      <div class="error-msg" id="inviteError"></div>
      <div class="success-msg" id="inviteSuccess"></div>

      <div class="field">
        <label>Their email</label>
        <input type="email" id="inviteEmail" placeholder="friend@example.com">
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <input type="text" id="inviteMessage" placeholder="Thought you'd like this">
      </div>

      <button class="submit-btn" id="sendInviteBtn">Send invite</button>
    </div>
  </div>

  <main>
    <div class="chat-container" id="chatContainer">
      <div class="empty-state" id="emptyState">
        <div class="eyebrow">Self-hosted · Qwen2.5-Coder</div>
        <h2>Ask something, attach a document,<br>or toggle web search.</h2>
      </div>
    </div>

    <div class="input-dock">
      <div class="dock-toprow">
        <div class="dropzone-bar" onclick="document.getElementById('fileInput').click()">
          <span id="fileLabel">📎 Attach PDF, image, or text file…</span>
          <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
        </div>
      </div>

      <textarea id="promptInput" placeholder="Ask a coding question, chat, or drop a file to summarize… (Enter to send, Shift+Enter for newline)"></textarea>

      <div class="dock-footer">
        <button class="btn-submit" id="sendBtn">Send <span>↑</span></button>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'https://olitapi.olittechnologies.co.in';

    // ---- Auth guard: bounce to login if not signed in ----
    const authRaw = localStorage.getItem('olit_nexus_auth');
    if (!authRaw) {
      window.location.href = 'login.html';
    }
    let auth = JSON.parse(authRaw || 'null');

    const chatContainer = document.getElementById('chatContainer');
    const emptyState = document.getElementById('emptyState');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyList = document.getElementById('historyList');
    const heartbeat = document.getElementById('heartbeat');
    const heartbeatText = document.getElementById('heartbeatText');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const menuToggle = document.getElementById('menuToggle');
    const mobileDot = document.getElementById('mobileDot');

    const profileAvatar = document.getElementById('profileAvatar');
    const profileName = document.getElementById('profileName');
    const profileEmail = document.getElementById('profileEmail');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsBackdrop = document.getElementById('settingsBackdrop');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const settingsEmail = document.getElementById('settingsEmail');
    const settingsName = document.getElementById('settingsName');
    const settingsPassword = document.getElementById('settingsPassword');
    const settingsError = document.getElementById('settingsError');
    const settingsSuccess = document.getElementById('settingsSuccess');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    function renderProfile() {
      if (!auth || !auth.user) return;
      const name = auth.user.name || auth.user.email;
      profileAvatar.textContent = name.charAt(0).toUpperCase();
      profileName.textContent = name;
      profileEmail.textContent = auth.user.email;
    }
    renderProfile();

    function openSettings() {
      settingsEmail.value = auth.user.email;
      settingsName.value = auth.user.name || '';
      settingsPassword.value = '';
      settingsError.classList.remove('show');
      settingsSuccess.classList.remove('show');
      settingsBackdrop.classList.add('show');
    }
    function closeSettings() { settingsBackdrop.classList.remove('show'); }

    settingsBtn.addEventListener('click', openSettings);
    closeSettingsBtn.addEventListener('click', closeSettings);
    settingsBackdrop.addEventListener('click', (e) => {
      if (e.target === settingsBackdrop) closeSettings();
    });

    saveSettingsBtn.addEventListener('click', async () => {
      settingsError.classList.remove('show');
      settingsSuccess.classList.remove('show');
      const name = settingsName.value.trim();
      const newPassword = settingsPassword.value;

      if (!name && !newPassword) {
        settingsError.textContent = 'Nothing to update.';
        settingsError.classList.add('show');
        return;
      }
      if (newPassword && newPassword.length < 8) {
        settingsError.textContent = 'New password must be at least 8 characters.';
        settingsError.classList.add('show');
        return;
      }

      saveSettingsBtn.disabled = true;
      saveSettingsBtn.textContent = 'Saving…';

      try {
        const body = {};
        if (name) body.name = name;
        if (newPassword) body.new_password = newPassword;

        const res = await fetch(`${API_BASE}/api/profile`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${auth.token}`
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (data.success) {
          auth.user = data.user;
          localStorage.setItem('olit_nexus_auth', JSON.stringify(auth));
          renderProfile();
          settingsPassword.value = '';
          settingsSuccess.textContent = 'Saved.';
          settingsSuccess.classList.add('show');
        } else {
          settingsError.textContent = data.error || 'Could not save changes.';
          settingsError.classList.add('show');
        }
      } catch {
        settingsError.textContent = 'Could not reach the backend.';
        settingsError.classList.add('show');
      } finally {
        saveSettingsBtn.disabled = false;
        saveSettingsBtn.textContent = 'Save changes';
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('olit_nexus_auth');
      window.location.href = 'login.html';
    });

    // ---- Invite modal ----
    const inviteTriggerBtn = document.getElementById('inviteTriggerBtn');
    const inviteBackdrop = document.getElementById('inviteBackdrop');
    const closeInviteBtn = document.getElementById('closeInviteBtn');
    const inviteEmail = document.getElementById('inviteEmail');
    const inviteMessage = document.getElementById('inviteMessage');
    const inviteError = document.getElementById('inviteError');
    const inviteSuccess = document.getElementById('inviteSuccess');
    const sendInviteBtn = document.getElementById('sendInviteBtn');

    function openInvite() {
      inviteEmail.value = '';
      inviteMessage.value = '';
      inviteError.classList.remove('show');
      inviteSuccess.classList.remove('show');
      inviteBackdrop.classList.add('show');
      closeDrawer();
    }
    function closeInvite() { inviteBackdrop.classList.remove('show'); }

    inviteTriggerBtn.addEventListener('click', openInvite);
    closeInviteBtn.addEventListener('click', closeInvite);
    inviteBackdrop.addEventListener('click', (e) => {
      if (e.target === inviteBackdrop) closeInvite();
    });

    sendInviteBtn.addEventListener('click', async () => {
      inviteError.classList.remove('show');
      inviteSuccess.classList.remove('show');
      const email = inviteEmail.value.trim();

      if (!email || !email.includes('@')) {
        inviteError.textContent = 'Enter a valid email address.';
        inviteError.classList.add('show');
        return;
      }

      sendInviteBtn.disabled = true;
      sendInviteBtn.textContent = 'Sending…';

      try {
        const res = await authFetch(`${API_BASE}/api/invite`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, message: inviteMessage.value.trim() })
        });
        const data = await res.json();

        if (data.success) {
          inviteSuccess.textContent = 'Invite sent.';
          inviteSuccess.classList.add('show');
          inviteEmail.value = '';
          inviteMessage.value = '';
        } else {
          inviteError.textContent = data.error || 'Could not send the invite.';
          inviteError.classList.add('show');
        }
      } catch {
        inviteError.textContent = 'Could not reach the backend.';
        inviteError.classList.add('show');
      } finally {
        sendInviteBtn.disabled = false;
        sendInviteBtn.textContent = 'Send invite';
      }
    });

    // ---- Authenticated fetch: attaches the JWT, and bounces to login on
    // an expired/invalid session instead of failing silently. ----
    async function authFetch(url, options = {}) {
      const headers = Object.assign({}, options.headers || {}, { 'Authorization': `Bearer ${auth.token}` });
      const res = await fetch(url, Object.assign({}, options, { headers }));
      if (res.status === 401) {
        localStorage.removeItem('olit_nexus_auth');
        window.location.href = 'login.html';
        throw new Error('Session expired');
      }
      return res;
    }

    // conversations: [{id, title}] — sidebar list only, fetched from the
    // server. Full message content for a conversation is fetched on demand
    // when opened, not cached client-side, so history is always accurate.
    let conversations = [];
    let currentChatId = null; // real Firestore conversation id, or null for an unsaved new chat

    // Bumped on every explicit view switch (new chat / load chat). A send
    // captures this value up front; if it's changed by the time the reply
    // arrives, the user has moved on, so the reply is saved to the server
    // (already handled server-side) without touching the now-irrelevant DOM.
    let viewGeneration = 0;

    function openDrawer() { sidebar.classList.add('open'); sidebarBackdrop.classList.add('show'); }
    function closeDrawer() { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('show'); }
    menuToggle.addEventListener('click', () => {
      sidebar.classList.contains('open') ? closeDrawer() : openDrawer();
    });
    sidebarBackdrop.addEventListener('click', closeDrawer);

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(5000) });
        if (res.ok) {
          heartbeat.className = 'heartbeat online';
          heartbeatText.textContent = 'backend online';
          mobileDot.className = 'mobile-dot online';
          return;
        }
        throw new Error('bad status');
      } catch {
        heartbeat.className = 'heartbeat offline';
        heartbeatText.textContent = 'backend unreachable';
        mobileDot.className = 'mobile-dot offline';
      }
    }
    checkHealth();
    setInterval(checkHealth, 30000);

    async function loadConversationList() {
      try {
        const res = await authFetch(`${API_BASE}/api/conversations`);
        const data = await res.json();
        if (data.success) {
          conversations = data.conversations;
          renderHistory();
        }
      } catch {
        // Sidebar just stays empty/stale — checkHealth already surfaces
        // backend-unreachable state, no need to duplicate that here.
      }
    }
    loadConversationList();

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) fileLabel.textContent = `📄 ${e.target.files[0].name}`;
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);
    newChatBtn.addEventListener('click', createNewChat);

    function createNewChat() {
      viewGeneration++;
      currentChatId = null;
      chatContainer.innerHTML = '';
      chatContainer.appendChild(emptyState);
      renderHistory();
      closeDrawer();
    }

    function showTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <span class="msg-header">Nexus Engine</span>
        <div class="msg-body typing-dots"><span></span><span></span><span></span></div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function handleSend() {
      const text = promptInput.value.trim();
      const hasFile = fileInput.files.length > 0;
      if (!text && !hasFile) return;

      // sendChatId is the SERVER conversation id, or null if this is a
      // brand-new, not-yet-created conversation. myGeneration is captured
      // now so a later switch-away (new chat, or opening another one) is
      // detected reliably even in the null/null case, where two different
      // "new chats" would otherwise look identical.
      const sendChatId = currentChatId;
      const myGeneration = viewGeneration;

      if (emptyState.parentNode === chatContainer) emptyState.remove();
      appendMessageBubble('user', text || `Attached file: ${fileInput.files[0].name}`);

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';
      promptInput.value = '';
      closeDrawer();

      const startedAt = performance.now();
      showTypingIndicator();

      try {
        let data;
        if (hasFile) {
          const formData = new FormData();
          formData.append('file', fileInput.files[0]);
          if (text) formData.append('text', text);
          if (sendChatId) formData.append('conversation_id', sendChatId);

          const res = await authFetch(`${API_BASE}/api/summarize`, { method: 'POST', body: formData });
          data = await res.json();

          if (viewGeneration === myGeneration) removeTypingIndicator();

          if (data.success) {
            const bubbleHtml = buildSummaryBubbleHtml(data, performance.now() - startedAt);
            if (viewGeneration === myGeneration) {
              currentChatId = data.conversation_id;
              chatContainer.insertAdjacentHTML('beforeend', bubbleHtml);
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          } else if (viewGeneration === myGeneration) {
            chatContainer.insertAdjacentHTML('beforeend', buildMessageBubbleHtml('bot', `Error: ${data.error}`));
          }

          fileInput.value = '';
          fileLabel.textContent = '📎 Attach PDF, image, or text file…';
        } else {
          const res = await authFetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, ...(sendChatId ? { conversation_id: sendChatId } : {}) })
          });
          data = await res.json();

          if (viewGeneration === myGeneration) removeTypingIndicator();

          if (data.success) {
            if (viewGeneration === myGeneration) {
              currentChatId = data.conversation_id;
              chatContainer.insertAdjacentHTML(
                'beforeend',
                buildMessageBubbleHtml('bot', data.reply, data.sources, performance.now() - startedAt)
              );
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          } else if (viewGeneration === myGeneration) {
            chatContainer.insertAdjacentHTML('beforeend', buildMessageBubbleHtml('bot', `Error: ${data.error}`));
          }
        }

        // The server always returns the conversation's current title —
        // refresh the sidebar entry whether or not this chat is still on
        // screen, so a background reply still updates the list correctly.
        if (data && data.success) {
          upsertConversationInList(data.conversation_id, data.title);
          // For a brand-new conversation, the backend returns a
          // placeholder title and generates the real one in the
          // background (so it doesn't add to reply latency) — refresh
          // once shortly after to pick it up.
          if (!sendChatId) {
            setTimeout(loadConversationList, 3000);
          }
        }
      } catch (err) {
        if (viewGeneration === myGeneration) {
          removeTypingIndicator();
          chatContainer.insertAdjacentHTML(
            'beforeend',
            buildMessageBubbleHtml('bot', 'Could not reach the backend. Check the heartbeat status in the sidebar.')
          );
        }
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = 'Send <span>↑</span>';
      }
    }

    function upsertConversationInList(id, title) {
      const idx = conversations.findIndex(c => c.id === id);
      if (idx >= 0) {
        conversations[idx].title = title;
        const [item] = conversations.splice(idx, 1);
        conversations.unshift(item);
      } else {
        conversations.unshift({ id, title });
      }
      renderHistory();
    }

    function buildMessageBubbleHtml(role, content, sources = [], latencyMs = null) {
      let sourcesHtml = '';
      if (sources && sources.length) {
        sourcesHtml = `<ul class="sources-list">` +
          sources.map(url => `<li><a href="${url}" target="_blank">🔗 ${new URL(url).hostname}</a></li>`).join('') +
          `</ul>`;
      }
      const latencyTag = latencyMs !== null ? `<span class="latency">· ${Math.round(latencyMs)}ms</span>` : '';
      const webTag = sources && sources.length ? `<span class="web-tag">· 🔎 web</span>` : '';

      return `<div class="message ${role}">
        <span class="msg-header">${role === 'user' ? '' : `Nexus Engine ${latencyTag}${webTag}`}</span>
        <div class="msg-body">${formatBotResponse(content)}${sourcesHtml}</div>
      </div>`;
    }

    function appendMessageBubble(role, content, sources = [], latencyMs = null) {
      chatContainer.insertAdjacentHTML('beforeend', buildMessageBubbleHtml(role, content, sources, latencyMs));
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function formatBotResponse(text) {
      let formatted = escapeHtml(text);
      formatted = formatted.replace(/```(?:\w+\n)?([\s\S]*?)```/g, (match, code) =>
        `<div class="code-block-wrapper"><button class="copy-code-btn" onclick="copyCodeBlock(this)">Copy</button><pre><code>${code}</code></pre></div>`
      );
      formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

      const lines = formatted.split('\n');
      let insideList = false;
      let finalHtml = '';
      lines.forEach(line => {
        const t = line.trim();
        if (t.startsWith('- ') || t.startsWith('* ')) {
          if (!insideList) { finalHtml += '<ul>'; insideList = true; }
          finalHtml += `<li>${t.substring(2)}</li>`;
        } else {
          if (insideList) { finalHtml += '</ul>'; insideList = false; }
          finalHtml += line + '\n';
        }
      });
      if (insideList) finalHtml += '</ul>';
      return finalHtml.replace(/\n/g, '<br>');
    }

    function buildSummaryBubbleHtml(data, latencyMs) {
      const points = data.summary.map(pt => `• ${pt}`).join('\n');
      const latencyTag = latencyMs !== null ? `<span class="latency">· ${Math.round(latencyMs)}ms</span>` : '';

      return `<div class="message bot">
        <span class="msg-header">Nexus Engine ${latencyTag}</span>
        <div class="msg-body">
          <div class="metrics-bar">
            <div class="metric-item"><div class="metric-value">${data.stats.total_words}</div><div class="metric-label">Words</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.reduction}%</div><div class="metric-label">Reduction</div></div>
            <div class="metric-item"><div class="metric-value">${data.stats.read_time}m</div><div class="metric-label">Read time</div></div>
          </div>
          ${formatBotResponse(points)}
        </div>
      </div>`;
    }

    window.copyCodeBlock = function(btn) {
      const codeEl = btn.parentElement.querySelector('code');
      const text = codeEl.textContent;
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1500);
      }).catch(() => {
        btn.textContent = 'Failed';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
      });
    };

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#x27;").replace(/"/g, "&quot;");
    }

    function renderHistory() {
      historyList.innerHTML = conversations.map(c => `
        <div class="history-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat('${c.id}')">
          <span class="history-title" data-id="${c.id}">${escapeHtml(c.title || "New chat")}</span>
          <span class="history-actions">
            <span class="rename-btn" title="Rename" onclick="startRename(event, '${c.id}')">✎</span>
            <span class="delete-btn" onclick="deleteChat(event, '${c.id}')">✕</span>
          </span>
        </div>
      `).join('');
    }

    window.loadChat = async (id) => {
      viewGeneration++;
      currentChatId = id;
      closeDrawer();
      chatContainer.innerHTML = '<div class="empty-state"><div class="eyebrow">Loading…</div></div>';
      try {
        const res = await authFetch(`${API_BASE}/api/conversations/${id}`);
        const data = await res.json();
        if (!data.success) {
          chatContainer.innerHTML = '';
          appendMessageBubble('bot', `Error: ${data.error || 'Could not load this conversation.'}`);
          return;
        }
        chatContainer.innerHTML = '';
        for (const msg of data.messages) {
          if (msg.type === 'summary') {
            chatContainer.insertAdjacentHTML('beforeend', buildSummaryBubbleHtml({ summary: msg.summary, stats: msg.stats }, null));
          } else {
            chatContainer.insertAdjacentHTML('beforeend', buildMessageBubbleHtml(msg.role, msg.content, msg.sources || []));
          }
        }
        chatContainer.scrollTop = chatContainer.scrollHeight;
        renderHistory();
      } catch {
        chatContainer.innerHTML = '';
        appendMessageBubble('bot', 'Could not reach the backend. Check the heartbeat status in the sidebar.');
      }
    };

    window.deleteChat = async (e, id) => {
      e.stopPropagation();
      try {
        await authFetch(`${API_BASE}/api/conversations/${id}`, { method: 'DELETE' });
      } catch {
        return;
      }
      conversations = conversations.filter(c => c.id !== id);
      if (currentChatId === id) createNewChat();
      else renderHistory();
    };

    window.startRename = (e, id) => {
      e.stopPropagation();
      const span = historyList.querySelector(`.history-title[data-id="${id}"]`);
      if (!span) return;
      const current = span.textContent;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = current;
      input.className = 'rename-input';
      span.replaceWith(input);
      input.focus();
      input.select();

      const commit = async () => {
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== current) {
          try {
            await authFetch(`${API_BASE}/api/conversations/${id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: newTitle })
            });
            const entry = conversations.find(c => c.id === id);
            if (entry) entry.title = newTitle;
          } catch { /* fall through to re-render with prior state */ }
        }
        renderHistory();
      };

      input.addEventListener('blur', commit);
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') input.blur();
        if (ev.key === 'Escape') { input.value = current; input.blur(); }
      });
    };

    renderHistory();
  </script>
</body>
</html>
